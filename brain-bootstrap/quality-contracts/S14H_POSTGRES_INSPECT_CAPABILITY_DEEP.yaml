  - {id: UC06, name: credential_connection_or_raw_postgres_error_leak, required: 0}
  - {id: UC07, name: deadline_retry_cleanup_or_orphan_client_escape, required: 0}
  - {id: UC08, name: result_order_row_limit_or_output_bound_bypass, required: 0}
  - {id: UC09, name: restricted_registry_or_provider_swap_boundary_bypass, required: 0}
  - {id: UC10, name: protected_dependency_future_phase_or_self_closure_drift, required: 0}

