schema_version: "1.0"
id: S13R_DEPLOYMENT_DEEP
step: S13R
name: deployment
version: "1.0.0"
status: AUTHORING_READY
depth: DEEP
classification: SKILL_ONLY
honor_invariant_candidate: HI-053

canonical_artifacts:
  skill: brain-bootstrap/skills/DEPLOYMENT_SKILL_S13R.md
  quality_contract: brain-bootstrap/quality-contracts/S13R_DEPLOYMENT_DEEP.yaml
  semantic_contract: brain-bootstrap/specs/DEPLOYMENT_CONTRACT_S13R.md

purpose: >-
  Prove that S13R derives Docker-first, provider-neutral deployment artifacts and
  verification requirements from exact target-repository/runtime facts without
  inventing an executable unit, port, health surface, environment variable,
  secret value, persistence topology or provider, and without claiming package
  or deployed verification absent real execution evidence.

depth_selection:
  result: DEEP
  floors:
    infrastructure_change: true
    secret_handling: true
    external_side_effect_risk: true
  ratings:
    risk:
      level: HIGH
      reason: >-
        Deployment can expose services, secrets and storage, execute privileged
        build/runtime operations, and make false production-readiness claims.
    ambiguity:
      level: HIGH
      reason: >-
        The bootstrap says Docker first, environment/secrets, health checks and
        deploy verification, while the current Brain repo itself has no executable
        production entry point or canonical provider.
    novelty:
      level: HIGH
      reason: >-
        No prior S13x owns container packaging or deployed-verification semantics.
    irreversibility:
      level: HIGH
      reason: >-
        Published images, leaked secrets and mutated external resources may be
        difficult to retract completely.
    downstream_impact:
      level: HIGH
      reason: >-
        S13R is the final S13x engineering skill before S14 capability/tool work;
        unsafe deployment semantics would contaminate later automation.

repository_decisions:
  - id: DEC-01
    decision: S13R is DEEP plus SKILL_ONLY; no new AgentDefinition is justified.
  - id: DEC-02
    decision: >-
      S13R is a reusable deployment-engineering Skill for target projects, not a
      mandate to turn brain-veleiro itself into a server.
  - id: DEC-03
    decision: >-
      Docker-first means provider-neutral OCI packaging for an already-existing
      executable SERVICE, WORKER, JOB or CLI. Runtime invention is forbidden.
  - id: DEC-04
    decision: >-
      The S13R reference module is deterministic and side-effect-free. A coding
      agent may apply its approved plan externally, but the canonical planner
      performs no filesystem, shell, Docker, network or provider mutation.
  - id: DEC-05
    decision: >-
      No deployment provider is selected in v1. Provider-specific adapters and
      the multi-provider deployment factory remain deferred.
  - id: DEC-06
    decision: >-
      Health/readiness is derived from existing runtime semantics; a fake HTTP
      health server/route is forbidden. JOB/CLI verification uses bounded exit/result.
  - id: DEC-07
    decision: >-
      Existing persistence semantics are preserved. S13R does not migrate SQLite
      or local files to a new database/provider merely for deployment.
  - id: DEC-08
    decision: >-
      READY_TO_PACKAGE, PACKAGE_VERIFIED and DEPLOYED_VERIFIED are distinct; the
      latter two require real evidence for the exact revision/artifact.
  - id: DEC-09
    decision: >-
      Real Docker/OCI build plus container exercise is a mandatory executable
      verification gate for S13R closure; lack of runtime remains an explicit blocker.

uncertainty_and_limitations:
  - id: LIM-01
    statement: >-
      The current brain-veleiro repo is a library/in-process SDK and has no
      production entry point, start command, port or long-running process.
  - id: LIM-02
    statement: >-
      The current builder WSL environment has Docker CLI evidence but no usable
      Docker daemon/runtime; real container verification may require another approved environment.
  - id: LIM-03
    statement: >-
      better-sqlite3 is a native dependency; target ABI/libc and prebuild/toolchain
      compatibility must be explicit when it is part of a deployable target.
  - id: LIM-04
    statement: >-
      No canonical hosting provider or CI/CD system exists in the repository.
  - id: LIM-05
    statement: >-
      S13R cannot prove SLOs, backup/recovery, compliance, autoscaling or cost optimization.

hard_invariants:
  - id: S13R-HI-001
    rule: Every deployment result binds one exact non-empty revision and requested deployment intent.
    failure: BLOCK
  - id: S13R-HI-002
    rule: Requested deployable unit kind is never silently changed to make deployment possible.
    failure: BLOCK
  - id: S13R-HI-003
    rule: SERVICE/WORKER/JOB/CLI entrypoint and start command are evidence-backed and non-invented.
    failure: BLOCK
  - id: S13R-HI-004
    rule: LIBRARY/NONE cannot be presented as a deployed service without an approved upstream runtime decision.
    failure: BLOCK
  - id: S13R-HI-005
    rule: Ports, protocols, routes, hostnames and health paths are evidence-backed or absent.
    failure: BLOCK
  - id: S13R-HI-006
    rule: Runtime major/base-image family follows accepted target evidence and never uses an unbounded latest tag for verified packaging.
    failure: BLOCK
  - id: S13R-HI-007
    rule: Existing lockfile semantics are preserved by the install plan.
    failure: BLOCK
  - id: S13R-HI-008
    rule: Native dependency platform/ABI/libc constraints and any required build toolchain are explicit.
    failure: BLOCK
  - id: S13R-HI-009
    rule: Build context excludes secrets, local dependency trees, VCS metadata and unapproved host artifacts.
    failure: BLOCK
  - id: S13R-HI-010
    rule: Final runtime uses least privilege; elevated privileges require explicit approved evidence.
    failure: BLOCK
  - id: S13R-HI-011
    rule: Every environment variable name is allowlisted and classified; unknown names are rejected.
    failure: BLOCK
  - id: S13R-HI-012
    rule: Secret values never enter structured output, Dockerfile, image config/layer, env examples, commands or evidence.
    failure: BLOCK
  - id: S13R-HI-013
    rule: Build-time and runtime configuration visibility are kept distinct.
    failure: BLOCK
  - id: S13R-HI-014
    rule: SERVICE health/readiness maps only to an existing evidence-backed endpoint or command.
    failure: BLOCK
  - id: S13R-HI-015
    rule: JOB/CLI uses bounded execution/exit semantics and never receives invented liveness/readiness endpoints.
    failure: BLOCK
  - id: S13R-HI-016
    rule: Unsupported graceful-shutdown behavior remains explicit and is never claimed implemented.
    failure: BLOCK
  - id: S13R-HI-017
    rule: Existing persistence durability is preserved; a new volume/provider/database is never inferred.
    failure: BLOCK
  - id: S13R-HI-018
    rule: Horizontal-scaling or multi-replica safety is never claimed without direct evidence.
    failure: BLOCK
  - id: S13R-HI-019
    rule: No named deployment provider is selected absent an approved provider decision/constraint.
    failure: BLOCK
  - id: S13R-HI-020
    rule: Provider SDK/MCP/OAuth/account-resource mutations are outside the canonical reference planner.
    failure: BLOCK
  - id: S13R-HI-021
    rule: READY_TO_PACKAGE never implies IMAGE_BUILT or CONTAINER_EXERCISED.
    failure: BLOCK
  - id: S13R-HI-022
    rule: PACKAGE_VERIFIED requires accepted real IMAGE_BUILT and CONTAINER_EXERCISED evidence for the exact artifact.
    failure: BLOCK
  - id: S13R-HI-023
    rule: DEPLOYED_VERIFIED requires accepted external deployment observation plus applicable health/job-exit evidence.
    failure: BLOCK
  - id: S13R-HI-024
    rule: Docker/runtime unavailability is reported and cannot be converted into simulated verification success.
    failure: BLOCK
  - id: S13R-HI-025
    rule: The reference planner performs no hidden filesystem, git, env, shell, Docker, network, provider, clock or randomness access.
    failure: BLOCK
  - id: S13R-HI-026
    rule: Equal normalized inputs produce byte-equivalent structured output and artifact projections.
    failure: BLOCK
  - id: S13R-HI-027
    rule: Actual-candidate gating evaluates the parsed S12->S10->S09 candidate and never a faithful substitute.
    failure: BLOCK
  - id: S13R-HI-028
    rule: Core and AgentDefinition remain semantically unchanged; no provider/vendor branching leaks into them.
    failure: BLOCK
  - id: S13R-HI-029
    rule: S14+ capability/verifier/workflow/orchestration/release responsibilities are not pulled forward.
    failure: BLOCK
  - id: S13R-HI-030
    rule: Candidate cannot self-award S13R PASS, HI-053 or independent verification.
    failure: BLOCK

semantic_dimensions:
  - id: D01_IDENTITY_SCOPE
    name: Revision, intent and deployable-unit honesty
    assertions:
      - { id: A01, statement: Exact target revision and artifact identity are preserved. }
      - { id: A02, statement: Requested deployment intent and unit kind are preserved. }
      - { id: A03, statement: Missing executable unit blocks service deployment instead of inventing runtime. }
  - id: D02_RUNTIME_ENTRYPOINT
    name: Runtime and entrypoint fidelity
    assertions:
      - { id: A04, statement: Entrypoint/start command derives from accepted repository facts. }
      - { id: A05, statement: Port/protocol/route exposure is evidence-backed or absent. }
      - { id: A06, statement: SERVICE/WORKER/JOB/CLI lifecycle semantics remain distinct. }
  - id: D03_CONTAINER_BUILD
    name: Container build reproducibility
    assertions:
      - { id: A07, statement: Base runtime and target platform are bounded and evidence-aligned. }
      - { id: A08, statement: Lock-faithful install/build/native-dependency plan is reproducible. }
      - { id: A09, statement: Build context and final runtime apply minimization and least privilege. }
  - id: D04_ENV_SECRETS
    name: Environment and secret safety
    assertions:
      - { id: A10, statement: Environment names are allowlisted and correctly classified. }
      - { id: A11, statement: Secret references may appear but secret values never do. }
      - { id: A12, statement: Build-only and runtime config are not conflated. }
  - id: D05_HEALTH_LIFECYCLE
    name: Health, readiness and lifecycle truth
    assertions:
      - { id: A13, statement: SERVICE health/readiness uses an existing evidence-backed surface. }
      - { id: A14, statement: JOB/CLI verification uses bounded execution rather than fake HTTP health. }
      - { id: A15, statement: Shutdown/cleanup uncertainty remains explicit. }
  - id: D06_PERSISTENCE
    name: Persistence and durability preservation
    assertions:
      - { id: A16, statement: Current storage and durability class are represented correctly. }
      - { id: A17, statement: S13R does not migrate or replace the persistence provider. }
      - { id: A18, statement: Volumes/mounts are proposed only when existing durable semantics require them. }
  - id: D07_PROVIDER_NEUTRALITY
    name: Provider-neutral deployment boundary
    assertions:
      - { id: A19, statement: No provider is selected without an approved decision/constraint. }
      - { id: A20, statement: Provider-specific adapters/SDKs/MCP/OAuth remain deferred. }
      - { id: A21, statement: Provider handoff contains only generic evidence-backed requirements. }
  - id: D08_VERIFICATION_TRUTH
    name: Package and deployed verification truth
    assertions:
      - { id: A22, statement: IMAGE_BUILT evidence binds the exact revision/artifact. }
      - { id: A23, statement: CONTAINER_EXERCISED proves the applicable runtime observable. }
      - { id: A24, statement: DEPLOYED_VERIFIED requires direct accepted external deployment evidence. }
  - id: D09_SECURITY_DETERMINISM
    name: Security, native compatibility and determinism
    assertions:
      - { id: A25, statement: No secret-bearing material leaks into artifacts, commands or evidence. }
      - { id: A26, statement: Native/platform/lock/runtime compatibility is explicit and bounded. }
      - { id: A27, statement: Planner output is deterministic and hidden-I/O free. }
  - id: D10_GOVERNANCE
    name: Architecture and stage governance
    assertions:
      - { id: A28, statement: Deployment does not invent a product server or unrelated runtime. }
      - { id: A29, statement: Core/AgentDefinition/S14+ boundaries remain unchanged. }
      - { id: A30, statement: Candidate does not self-certify step/honor/verification status. }

