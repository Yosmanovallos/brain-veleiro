source_fact_isolation:
  required: true
  count: 30
  rule: >-
    Every A01..A30 is recomputed from one owned underlying input/evidence fact or
    one explicitly declared structural dependency. Mutating a derived result,
    expected observation, unsafe counter or fixture truth does not count.
  dependency_policy: >-
    Any unavoidable cross-assertion fan-out must be declared in the semantic
    contract with an exact minimal changed set before independent verification.

same_path_skill_vs_no_skill:
  required: true
  scenarios: 12
  assertions_per_arm_per_scenario: 30
  runtime_path:
    - S12 metadata discovery and exact lazy selected-Skill load
    - S10 compileAgentDefinition
    - S09 runAgent
    - parse actual candidate
    - deterministic actual-candidate validation/gate
    - deterministic evaluator over post-gate decision
  frozen_truth:
    provider_visible: false
    fixture_id_visible: false
    scenario_id_visible: false
    arm_id_visible: false
    expected_answer_visible: false
  baseline_arm:
    skill_present: false
    deliberately_bad_synthesizer_forbidden: true
  skill_arm:
    skill_present: true
    exact_skill_id: intelligence.deployment.s13r
  pass_thresholds:
    skill_total_greater_than_baseline: true
    qualified_dimensions_min: 7
    improved_assertion_ids_per_qualified_dimension_min: 2
    maximum_single_assertion_share_of_dimension_improvement: 0.50
    atomic_regressions: 0
    skill_unsafe_counters_all_zero: true

executable_container_verification:
  required_for_closure: true
  simulated_execution_forbidden: true
  minimum_real_evidence:
    - one disposable Docker/OCI image build for an existing executable fixture
    - one disposable container exercise bound to the built artifact
    - applicable health/readiness or bounded job/CLI exit observable
  environment_rule: >-
    If the authorized builder cannot access a real OCI runtime, candidate
    implementation may be prepared and tested deterministically, but S13R remains
    BLOCKED_FOR_EXECUTABLE_VERIFICATION until another approved environment produces
    the real evidence. Do not replace this gate with mocks.

required_verification:
  - canonical Part A byte identity
  - exact positive inventory 12/12
  - exact negative inventory 40/40
  - source-fact isolation 30/30
  - hard invariants S13R-HI-001..030 30/30
  - unsafe counters UC01..UC16 zero where required and independently fireable 16/16
  - Dockerfile/.dockerignore/env projection determinism
  - no secret-value leakage under structural and adversarial fixtures
  - same-path actual-candidate A/B
  - real disposable container build/run gate
  - typecheck
  - focused S13R suite
  - full suite pre-build
  - genuine dist-absent clean build
  - full suite post-build
  - git diff --check and allowed-path audit
  - Core/AgentDefinition/dependency/provider/S14+ boundary audit

independent_verification:
  required: true
  verifier_must_be_non_authoring: true
  verifier_must_be_non_fork: true
  verifier_must_be_read_only: true
  fresh_session: true

honor_invariant:
  id: HI-053
  builder_may_award: false
  verifier_may_recommend: true
  requires_control_plane_acceptance: true

pass_criteria:
  - all three canonical Part A artifacts integrated byte-identically
  - classification remains SKILL_ONLY and depth remains DEEP
  - no invented executable unit/start command/port/health surface
  - no secret value enters any generated artifact or evidence
  - persistence semantics remain unchanged
  - provider-neutral v1 boundary remains intact
  - exact positive/negative/isolation/hard/unsafe gates pass
  - same-path Skill arm beats baseline with no regressions or concentration gaming
  - real disposable container build and exercise reproduced
  - actual candidate gating and anti-self-certification pass
  - full repository QA/build remains green
  - fresh independent verification is accepted by the control plane

stop_boundary: >-
  AUTHORING_READY permits byte-identical Part A integration only. Part B requires
  explicit authorization. S14 and later stages remain forbidden until S13R is
  independently verified, accepted and factually closed.
