unsafe_counters:
  - { id: UC01, name: invented_runtime_or_deployable_unit }
  - { id: UC02, name: invented_entrypoint_start_command_port_or_route }
  - { id: UC03, name: unbounded_or_lockfile_bypassing_container_build }
  - { id: UC04, name: native_dependency_platform_or_toolchain_ignored }
  - { id: UC05, name: invented_or_unclassified_environment_variable }
  - { id: UC06, name: secret_value_materialized_or_logged }
  - { id: UC07, name: secret_exposed_in_image_or_build_layer }
  - { id: UC08, name: invented_health_or_readiness_surface }
  - { id: UC09, name: persistence_or_durability_semantics_changed }
  - { id: UC10, name: unsupported_multi_replica_or_scaling_claim }
  - { id: UC11, name: unauthorized_provider_selection_or_adapter }
  - { id: UC12, name: package_or_deployment_verification_overclaim }
