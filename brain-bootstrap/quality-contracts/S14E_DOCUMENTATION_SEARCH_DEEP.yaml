hard_invariants:
  - {id: S14E-HI-001, rule: Exactly documentation.search is advertised with truthful NONE and faithful closed schemas.}
  - {id: S14E-HI-002, rule: Existing Core AgentDefinition Restricted registry and S11 interfaces and files remain unchanged.}
  - {id: S14E-HI-003, rule: Explicit trusted snapshot configuration has no discovery or model overrides.}
  - {id: S14E-HI-004, rule: Strict bounded configuration validation rejects duplicate IDs invalid Unicode controls unknown fields and finite secret-floor matches.}
  - {id: S14E-HI-005, rule: Copied snapshot and returned descriptor/result mutation cannot change future invocations.}
  - {id: S14E-HI-006, rule: Input is exactly query plus optional bounded integer limit and validated envelope.}
  - {id: S14E-HI-007, rule: Literal ASCII-folded tokens match title or one line with AND semantics and first matching line only.}
  - {id: S14E-HI-008, rule: One hit per document sorted by ASCII ID is independent of insertion order.}
  - {id: S14E-HI-009, rule: Explicit total_matches and truncated reflect a completed scan and no-match is offline SUCCESS.}
  - {id: S14E-HI-010, rule: Excerpts are exact normalized lines with full-text SHA256 and exact logical locators.}
  - {id: S14E-HI-011, rule: Evidence refs equal ordered result locators with no invented freshness or authority.}
  - {id: S14E-HI-012, rule: Retrieval content is inert and cannot trigger tools approvals or routing changes.}
  - {id: S14E-HI-013, rule: One monotonic deadline covers validation scan output and final success with cooperative yields and no orphan work.}
  - {id: S14E-HI-014, rule: Legal maxima pass the result guard and real registry envelope without silent truncation.}
  - {id: S14E-HI-015, rule: Errors use existing unions fixed safe messages and preserve typed result correlation.}
  - {id: S14E-HI-016, rule: Provider performs zero filesystem process network database or MCP activity.}
  - {id: S14E-HI-017, rule: Restricted capability and NONE denials cause zero underlying invocations.}
  - {id: S14E-HI-018, rule: Actual registry Restricted and runAgent compose without provider-specific generic changes.}
  - {id: S14E-HI-019, rule: Corpus and implementation swaps in separate configurations preserve AgentDefinition permission and semantic input bytes.}
  - {id: S14E-HI-020, rule: Part A and prior tracked surfaces stay locked with no dependency future-phase or self-closure change.}
unsafe_counters:
  - {id: UC01, name: unapproved_io_or_model_config_override, required: 0}
  - {id: UC02, name: invalid_input_or_limit_bypass, required: 0}
  - {id: UC03, name: fabricated_excerpt_provenance_or_hidden_truncation, required: 0}
  - {id: UC04, name: permission_or_deadline_bypass, required: 0}
  - {id: UC05, name: secret_floor_error_leak_or_instruction_execution, required: 0}
  - {id: UC06, name: protected_scope_drift_or_self_approval, required: 0}
positive_fixtures:
  - {id: FX-POS-001, intent: Exact descriptor and defensive descriptor copies satisfy closed schemas.}
  - {id: FX-POS-002, intent: Distinct real document queries yield independently calculated different hits through provider invoke.}
  - {id: FX-POS-003, intent: Title and same-line AND matching first-line selection and one-hit-per-document are exact.}
  - {id: FX-POS-004, intent: Empty corpus and no-match return complete offline SUCCESS with empty evidence.}
  - {id: FX-POS-005, intent: Default and explicit limits total count and truncated remain correct under reordered corpus.}
  - {id: FX-POS-006, intent: CRLF and CR normalization exact excerpt lines hashes and locators agree with independent oracle.}
  - {id: FX-POS-007, intent: Unicode exactness ASCII folding duplicate tokens and literal regex-like punctuation obey spec.}
  - {id: FX-POS-008, intent: Individual legal maxima and feasible combinations pass including escaped JSON text through real registry.}
  - {id: FX-POS-009, intent: Caller config result and descriptor mutation plus concurrent calls cannot alter snapshot or other results.}
  - {id: FX-POS-010, intent: Allowed real registry Restricted and runAgent invocation returns faithful result with unchanged generic code.}
  - {id: FX-POS-011, intent: Separate corpus swap and independently implemented test-provider swap preserve AgentDefinition and permission bytes.}
  - {id: FX-POS-012, intent: Hostile retrieved instructions remain inert with zero guarded IO and legitimate call succeeds after timeout.}
negative_fixtures:
  - {id: FX-NEG-001, intent: Reject malformed config unknown keys invalid IDs duplicate IDs wrong types and oversized corpus.}
  - {id: FX-NEG-002, intent: Reject all title text line and aggregate overbounds plus lone surrogates and forbidden controls.}
  - {id: FX-NEG-003, intent: Each finite secret marker and bearer pattern blocks complete construction with safe error.}
  - {id: FX-NEG-004, intent: Reject empty whitespace-only oversized or malformed query and excessive token counts or lengths.}
  - {id: FX-NEG-005, intent: Reject null fractional nonfinite negative zero or oversized limits without coercion.}
  - {id: FX-NEG-006, intent: Reject every extra input key including path URL auth provider and corpus overrides before search.}
  - {id: FX-NEG-007, intent: Unknown capability and invalid envelope including invalid deadlines follow fixed failure mapping.}
  - {id: FX-NEG-008, intent: Terms split across different lines cannot create a false AND hit absent title coverage.}
  - {id: FX-NEG-009, intent: Deadline expiry during validation scan or finalization returns TIMEOUT without partial success or restarted budget.}
  - {id: FX-NEG-010, intent: Capability denial produces existing BLOCKED and zero provider invokes.}
  - {id: FX-NEG-011, intent: NONE denial produces existing BLOCKED and zero provider invokes.}
  - {id: FX-NEG-012, intent: Wrong snapshot hash locator excerpt line or invented count is independently detected as a defect.}
  - {id: FX-NEG-013, intent: Deliberately unsafe IO and permission bypass controls fire guarded detectors while real implementation remains zero.}
  - {id: FX-NEG-014, intent: Unexpected exception and output overbound controls produce safe normalized failures without query config or stack.}
  - {id: FX-NEG-015, intent: Divergent descriptor collision remains fail-closed and missing routing never selects a fallback.}
  - {id: FX-NEG-016, intent: Detect deliberate protected-file drift dependency addition future-phase pull-forward and false phase closure.}
