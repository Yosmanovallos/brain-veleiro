  - {id: FX-POS-008, intent: "write descriptor is LOCAL and passes only when LOCAL is explicitly permitted"}
  - {id: FX-POS-009, intent: "real provider routes through CapabilityRegistryProvider without special-case integration"}
  - {id: FX-POS-010, intent: "real runAgent path can read through RestrictedCapabilityProvider -> registry -> filesystem provider"}
