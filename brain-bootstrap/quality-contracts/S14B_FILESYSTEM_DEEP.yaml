  - {id: UC07, name: overwrite_without_matching_precondition, required: 0}
  - {id: UC08, name: secret_or_absolute_path_exposure, required: 0}
  - {id: UC09, name: silent_truncation_or_limit_bypass, required: 0}
  - {id: UC10, name: protected_boundary_modified, required: 0}
  - {id: UC11, name: future_phase_execution_pulled_forward, required: 0}
  - {id: UC12, name: s14_or_hi054_self_closure, required: 0}

