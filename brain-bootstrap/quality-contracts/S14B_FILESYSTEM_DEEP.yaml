parent_step: S14
phase: S14B
name: filesystem
version: "1.0.0"
status: AUTHORING_READY
classification: RUNTIME_INFRASTRUCTURE
depth: DEEP
honor_invariant: HI-054_NOT_AWARDED

canonical_artifacts:
  skill: brain-bootstrap/skills/FILESYSTEM_CAPABILITY_SKILL_S14B.md
  quality_contract: brain-bootstrap/quality-contracts/S14B_FILESYSTEM_DEEP.yaml
  semantic_contract: brain-bootstrap/specs/FILESYSTEM_CAPABILITY_CONTRACT_S14B.md

baseline:
  main: 07778e20f12dfc381ccf79f9de5cb7e5317a270f
  s14a_verified_target: 62ef79faecfb0d949fce3dd748fc2ab21a8a05a8
  s14a_phase_closure: 07778e20f12dfc381ccf79f9de5cb7e5317a270f

capabilities:
  - id: filesystem.read
    side_effects: NONE
  - id: filesystem.list
    side_effects: NONE
  - id: filesystem.write
    side_effects: LOCAL

limits:
  max_path_chars: 4096
  max_path_segments: 256
  max_segment_utf8_bytes: 255
  max_read_bytes: 1048576
  max_write_bytes: 1048576
  max_list_entries: 1000
  max_allow_prefixes_per_mode: 64
  max_evidence_refs: 8
  max_safe_error_chars: 500

scope:
  allowed:
    - provider-layer WorkspaceFilesystemCapabilityProvider
    - explicit workspace root configuration
    - explicit read/write allow prefixes
    - filesystem.read
    - filesystem.list
    - filesystem.write
    - real disposable temp-workspace tests
    - Node 24 built-in fs/path/crypto/os APIs
    - registry composition tests
    - RestrictedCapabilityProvider composition tests
    - bounded safe evidence refs
  forbidden:
    - Core semantic edits
    - AgentDefinition edits
    - S14A registry semantic edits
    - dependency additions
    - filesystem delete/rename/move/mkdir/chmod/watch
    - binary filesystem capability
    - shell
    - git process execution
    - GitHub API
    - network documentation/search
    - browser
    - PostgreSQL
    - MCP
    - OAuth
    - credential storage
    - S15_plus_work

hard_invariants:
  - {id: S14B-HI-001, rule: "Exactly filesystem.read, filesystem.list and filesystem.write are exposed by the S14B provider."}
  - {id: S14B-HI-002, rule: "Provider implements the existing CapabilityProvider contract without Core changes."}
  - {id: S14B-HI-003, rule: "workspace_root is explicit; no cwd/env/home/repository inference exists."}
  - {id: S14B-HI-004, rule: "Every requested logical path is provider-neutral, workspace-relative and validated before target filesystem access."}
  - {id: S14B-HI-005, rule: "Absolute, drive-prefixed, UNC, backslash, NUL, dot-segment, dot-dot and empty-segment traversal forms fail closed."}
  - {id: S14B-HI-006, rule: "Read/list require explicit read-allow coverage; write requires explicit write-allow coverage."}
  - {id: S14B-HI-007, rule: "No implicit root-wide write permission exists."}
  - {id: S14B-HI-008, rule: "Mandatory protected credential/control paths fail closed even when otherwise allowed."}
  - {id: S14B-HI-009, rule: "Existing symlink components and symlink targets are never followed for read or write."}
  - {id: S14B-HI-010, rule: "Write never mutates an existing target with link count greater than one."}
  - {id: S14B-HI-011, rule: "Resolved host targets remain contained under the canonical explicit workspace root."}
  - {id: S14B-HI-012, rule: "filesystem.read returns only a bounded UTF-8 regular file."}
  - {id: S14B-HI-013, rule: "filesystem.list is non-recursive, bounded and deterministically sorted."}
  - {id: S14B-HI-014, rule: "filesystem.write accepts bounded UTF-8 text only."}
  - {id: S14B-HI-015, rule: "CREATE_NEW never clobbers an existing target."}
  - {id: S14B-HI-016, rule: "OVERWRITE_EXISTING requires expected_sha256."}
  - {id: S14B-HI-017, rule: "Hash mismatch fails closed without target mutation."}
  - {id: S14B-HI-018, rule: "Ordinary write failure cannot leave partially replaced target content."}
  - {id: S14B-HI-019, rule: "Write temporary artifacts are removed on failed pre-commit operations."}
  - {id: S14B-HI-020, rule: "Recognizable secret material is not returned by read or accepted by write."}
  - {id: S14B-HI-021, rule: "Tool outputs/errors/evidence never expose the absolute workspace root."}
  - {id: S14B-HI-022, rule: "Evidence refs use bounded workspace:// logical references only."}
  - {id: S14B-HI-023, rule: "filesystem.read and filesystem.list truthfully declare side_effects NONE."}
  - {id: S14B-HI-024, rule: "filesystem.write truthfully declares side_effects LOCAL."}
  - {id: S14B-HI-025, rule: "RestrictedCapabilityProvider capability denial prevents provider execution."}
  - {id: S14B-HI-026, rule: "RestrictedCapabilityProvider side-effect denial prevents filesystem.write mutation."}
  - {id: S14B-HI-027, rule: "The real provider operates through CapabilityRegistryProvider with no registry special case."}
  - {id: S14B-HI-028, rule: "Same AgentDefinition remains valid across explicit filesystem provider configuration changes."}
  - {id: S14B-HI-029, rule: "Timeout/error normalization does not leak raw paths, stacks or secret-bearing exception text."}
  - {id: S14B-HI-030, rule: "Write timeout cannot report TIMEOUT after a successful committed target mutation."}
  - {id: S14B-HI-031, rule: "All canonical path/content/list/evidence limits are enforced and not silently truncated."}
  - {id: S14B-HI-032, rule: "S14A registry production files remain byte-identical."}
  - {id: S14B-HI-033, rule: "Core, RestrictedCapabilityProvider and AgentDefinition remain byte-identical."}
  - {id: S14B-HI-034, rule: "package.json and package-lock.json remain byte-identical; no new dependency is added."}
  - {id: S14B-HI-035, rule: "No shell/git/network/browser/database/MCP/OAuth/S15+ implementation is pulled forward."}
  - {id: S14B-HI-036, rule: "S14B cannot close S14 or award HI-054."}

unsafe_counters:
  - {id: UC01, name: path_escape_accepted, required: 0}
  - {id: UC02, name: symlink_traversal_accepted, required: 0}
  - {id: UC03, name: implicit_root_or_scope_inference, required: 0}
