scope:
  allowed:
    - provider-layer WorkspaceShellCapabilityProvider
    - shell.execute
    - explicit workspace root
    - explicit trusted fixed command profiles
    - model input limited to profile_id and logical cwd
    - explicit fixed executable path and argv in provider configuration
    - explicit environment in provider configuration
    - Node 24 built-in child_process/fs/path/os APIs
    - Linux/WSL process-group timeout and overflow cleanup
    - real disposable process/workspace fixtures outside repository
    - CapabilityRegistryProvider composition
    - RestrictedCapabilityProvider composition
    - real runAgent shell.execute path
    - bounded logical evidence
  forbidden:
    - Core semantic edits
    - AgentDefinition edits
    - S14A registry semantic edits
    - S14B filesystem semantic edits
    - dependency additions
    - arbitrary model-provided command strings
    - model-provided executable
    - model-provided argv
    - model-provided environment
    - model-provided stdin
    - shell_true
    - interactive TTY or PTY
    - background-job or daemon-manager API
    - git capability implementation
    - GitHub API
    - documentation or web search
    - browser automation
    - PostgreSQL
    - MCP
    - OAuth
    - credential storage
    - S15_plus_work

hard_invariants:
  - {id: S14C-HI-001, rule: "Exactly shell.execute is exposed by the S14C provider."}
  - {id: S14C-HI-002, rule: "WorkspaceShellCapabilityProvider implements the existing CapabilityProvider contract without Core changes."}
  - {id: S14C-HI-003, rule: "shell.execute truthfully declares side_effects LOCAL for every configured profile."}
  - {id: S14C-HI-004, rule: "workspace_root is explicit and no cwd/env/home/git-root/repository inference selects it."}
  - {id: S14C-HI-005, rule: "Command profiles are explicit trusted provider configuration and cannot be created or modified by model input."}
  - {id: S14C-HI-006, rule: "Model-visible invocation input is exactly profile_id plus cwd; executable/argv/env/stdin/shell/provider overrides are rejected."}
  - {id: S14C-HI-007, rule: "profile_id is a bounded safe identifier and only a registered profile may execute."}
  - {id: S14C-HI-008, rule: "cwd is a provider-neutral logical workspace-relative path validated before spawn."}
  - {id: S14C-HI-009, rule: "cwd requires explicit selected-profile allow-prefix coverage with no implicit root-wide permission."}
  - {id: S14C-HI-010, rule: "Resolved cwd remains under the canonical explicit workspace root and string-prefix checks alone are insufficient."}
  - {id: S14C-HI-011, rule: "Symlink components/targets below the workspace root are not accepted as cwd."}
  - {id: S14C-HI-012, rule: "Protected credential/control cwd paths fail closed even when otherwise prefix-allowed."}
  - {id: S14C-HI-013, rule: "Each profile executable is explicit absolute provider configuration resolving to a regular executable file before the provider is invokable."}
  - {id: S14C-HI-014, rule: "Observed executable identity drift before spawn fails closed; the provider does not claim atomic fexecve protection in the final kernel spawn window."}
  - {id: S14C-HI-015, rule: "argv is fixed trusted profile configuration; model input cannot append, replace, interpolate or inject argv."}
  - {id: S14C-HI-016, rule: "Execution uses child_process spawn semantics with shell:false and no command-string concatenation."}
  - {id: S14C-HI-017, rule: "stdin is closed/ignored, no TTY/PTY exists, and S14C exposes no interactive shell."}
  - {id: S14C-HI-018, rule: "Child environment is explicit profile configuration and process.env is not implicitly inherited."}
  - {id: S14C-HI-019, rule: "Recognizable secret-bearing and dangerous loader/runtime-injection environment keys fail configuration validation."}
  - {id: S14C-HI-020, rule: "Profile count, executable, argv, environment, cwd, timeout, output, evidence and safe-error limits are enforced."}
  - {id: S14C-HI-021, rule: "Effective timeout is min(request.timeout_ms, profile.max_timeout_ms) and both are positive/bounded."}
  - {id: S14C-HI-022, rule: "stdout and stderr are captured as bounded pipes; successful results are never silently truncated."}
  - {id: S14C-HI-023, rule: "Model-visible stdout/stderr are strict UTF-8; invalid UTF-8 fails closed."}
  - {id: S14C-HI-024, rule: "Output overflow terminates the provider-created process group and returns a normalized failure rather than truncated SUCCESS."}
  - {id: S14C-HI-025, rule: "Recognizable secret material in captured process output is not returned to the model."}
  - {id: S14C-HI-026, rule: "Known canonical workspace/executable absolute paths are deterministically normalized and never returned raw."}
  - {id: S14C-HI-027, rule: "Natural process completion is SUCCESS observation even for nonzero exit status, with truthful exit_code/signal output."}
  - {id: S14C-HI-028, rule: "Timeout performs bounded process-group termination/cleanup before returning TIMEOUT and never claims rollback of already-completed LOCAL side effects."}
  - {id: S14C-HI-029, rule: "Canonical timeout/overflow fixtures leave no ordinary child/grandchild alive in the provider-created POSIX process group."}
  - {id: S14C-HI-030, rule: "Launch/OS/cleanup errors are safely normalized without raw stacks, secrets, executable paths or workspace-root leakage."}
  - {id: S14C-HI-031, rule: "RestrictedCapabilityProvider capability denial prevents shell provider execution."}
  - {id: S14C-HI-032, rule: "RestrictedCapabilityProvider LOCAL side-effect denial prevents child process spawn."}
  - {id: S14C-HI-033, rule: "The real shell provider operates through CapabilityRegistryProvider with no registry special case."}
  - {id: S14C-HI-034, rule: "A real runAgent path can invoke shell.execute through RestrictedCapabilityProvider and the registry."}
  - {id: S14C-HI-035, rule: "Changing the explicit shell provider/profile executable implementation does not change AgentDefinition bytes."}
  - {id: S14C-HI-036, rule: "Every legal maximum shell ToolInvocationResult remains transportable through the accepted 8388608-character registry result envelope."}
  - {id: S14C-HI-037, rule: "Core, AgentDefinition, RestrictedCapabilityProvider, accepted registry and S14B filesystem production surfaces remain byte-identical."}
  - {id: S14C-HI-038, rule: "package.json and package-lock.json remain byte-identical and no dependency is added."}
  - {id: S14C-HI-039, rule: "Canonical S14C profiles do not intentionally pull forward git/GitHub/network/docs/browser/PostgreSQL/MCP/OAuth/S15+ behavior, and the v1 trusted-profile/no-OS-sandbox limitation is documented without overclaiming."}
  - {id: S14C-HI-040, rule: "S14C cannot close S14, award HI-054 or authorize S14D."}

