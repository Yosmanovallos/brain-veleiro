source_fact_isolation:
  required: true
  count: 30
  rule: >-
    Each A01..A30 must be recomputed from an owned underlying input/evidence fact.
    Mutating that source fact must change only the governing assertion family
    unless the semantic contract explicitly declares a dependency. Flipping an
    already-derived boolean does not count as isolation.

same_path_skill_vs_no_skill:
  required: true
  scenarios: 12
  assertions_per_arm_per_scenario: 30
  runtime_path:
    - S12 metadata discovery and exact lazy selected-Skill load
    - S10 compileAgentDefinition
    - S09 runAgent
    - parse actual candidate
    - deterministic actual-candidate validation/gate
    - deterministic evaluator over post-gate decision
  frozen_truth:
    provider_visible: false
    fixture_id_visible: false
    scenario_id_visible: false
    arm_id_visible: false
    expected_answer_visible: false
  baseline_arm:
    skill_present: false
    deliberately_bad_synthesizer_forbidden: true
  skill_arm:
    skill_present: true
    must_consume_real_skill_content: true
  pass_threshold:
    candidate_total_correct_greater_than_baseline: true
    qualified_dimensions_min: 7
    distinct_improved_assertion_ids_per_qualified_dimension_min: 2
    max_single_assertion_share_per_qualified_dimension: 0.50
    atomic_regressions_max: 0
    all_skill_arm_unsafe_counters_zero: true
  anti_gaming:
    - no fixture/scenario/arm id branches
    - no expected map or grader truth in provider
    - no import of deterministic evaluator/gate/bundle builder into provider
    - irrelevant prose must not improve correctness
    - visible packet changes must still change outcomes
    - score post-gate decision, never raw rejected candidate

part_b_allowed_scope:
  - src/intelligence/delivery-documentation-demo/**
  - one append-only S12 reference Skill catalog entry
  - focused S13Q tests and deterministic fixtures
  - factual S13Q verification report and handoff
  - mechanical adjacent boundary-test updates only when required by the new canonical directory/catalog entry

part_b_forbidden_scope:
  - src/core semantic changes
  - new AgentDefinition
  - package.json or package-lock dependency changes
  - provider SDK or vendor binding
  - filesystem/network/browser/shell execution inside canonical S13Q module
  - README mutation as a runtime side effect
  - Docker/container/deployment/hosting/health-check implementation
  - secret provisioning
  - Capability Registry/MCP/connector/OAuth implementation
  - verifier Agent or workflow/orchestration implementation
  - semantic edits to S09..S13P canonical Part A
  - S13R or later-step implementation

required_builder_evidence:
  - Part A byte/blob integrity
  - standalone YAML parse and canonical cross-reference validation
  - Node 24 canonical runtime
  - typecheck PASS
  - exact 10 positive fixtures
  - exact 40 negative fixtures
  - 30/30 underlying-source-fact atomic isolation
  - 30/30 hard assertion observations per positive fixture where applicable
  - S13Q-HI-001..030 all true
  - UC01..UC12 all zero on positive fixtures and Skill A/B arm
  - each UC01..UC12 independently shown able to fire
  - real same-path 12-scenario Skill-vs-no-Skill evidence
  - raw per-assertion contribution counts by dimension
  - anti-gaming/source audit
  - actual candidate non-substitution proof
  - deterministic repeated-run equality proof
  - secret/privacy adversarial proof
  - architecture/dependency/protected-surface audit
  - full suite pre-build
  - genuine dist-absent clean build
  - full suite post-build
  - git diff --check and allowed-path audit

independent_verification:
  required: true
  verifier_must_be_non_authoring: true
  verifier_must_be_non_fork: true
  read_only: true
  fresh_session: true
  must_reproduce:
    - exact candidate SHA and ancestry
    - Part A hashes/blobs
    - 10 positives
    - 40 negatives
    - 30/30 source-fact isolation
    - all S13Q-HI-001..030
    - all 12 unsafe counters zero and independently fireable
    - 12-scenario A/B totals, raw contributions, qualification, regressions and concentration
    - actual-candidate gate
    - anti-gaming
    - determinism and secret/privacy safety
    - architecture/dependency/boundary audit
    - typecheck/full-pre-build/clean-build/full-post-build
    - verifier worktree immutability
  honor_invariant_award:
    id: HI-052
    builder_may_award: false
    verifier_may_recommend: true
    requires_control_plane_acceptance: true

pass_criteria:
  - canonical Part A integrated byte-identically
  - classification remains SKILL_ONLY
  - depth remains DEEP
  - exact delivered revision and scope honesty hold
  - structured package sections are evidence-grounded
  - setup/run procedure is reproducible and contains no invented repository facts
  - demo is a reproducible walkthrough over an existing surface
  - limitations and unknowns are explicit
  - next steps are status-labeled and do not pull future work forward
  - secret/privacy safety holds
  - 30 hard invariants pass
  - 10/10 semantic dimensions are evaluated
  - 10/10 positives pass
  - 40/40 negatives trigger their named governing failure
  - 30/30 source-fact isolation passes
  - A/B impact threshold passes without gaming
  - all 12 unsafe counters are zero where required and each is fireable
  - typecheck/full/build/post-build gates pass
  - protected architecture/dependency surfaces remain unchanged
  - fresh independent verification PASS is factually accepted
  - HI-052 is awarded only after independent/control-plane gate
  - S13R remains NOT_STARTED until S13Q factual closure
