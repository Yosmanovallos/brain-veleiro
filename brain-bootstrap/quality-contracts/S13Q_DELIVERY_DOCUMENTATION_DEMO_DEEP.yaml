schema_version: "1.0"
id: S13Q_DELIVERY_DOCUMENTATION_DEMO_DEEP
step: S13Q
name: delivery-documentation-demo
version: "1.0.0"
status: AUTHORING_READY
depth: DEEP
classification: SKILL_ONLY
honor_invariant_candidate: HI-052

canonical_artifacts:
  skill: brain-bootstrap/skills/DELIVERY_DOCUMENTATION_DEMO_SKILL_S13Q.md
  quality_contract: brain-bootstrap/quality-contracts/S13Q_DELIVERY_DOCUMENTATION_DEMO_DEEP.yaml
  semantic_contract: brain-bootstrap/specs/DELIVERY_DOCUMENTATION_DEMO_CONTRACT_S13Q.md

purpose: >-
  Prove that S13Q converts verified repository/build evidence into a truthful,
  reproducible and handoff-ready delivery package containing a README-grade
  summary, existing architecture summary, setup/run procedure, evidence-bound
  demo script, explicit limitations, next steps and provenance without inventing
  product behavior or pulling deployment/capabilities/verifier/runtime work forward.

depth_selection:
  result: DEEP
  floors:
    delivery_claim_integrity: true
    security_and_secret_handling: true
  ratings:
    risk:
      level: HIGH
      reason: >-
        Delivery documentation is the final human-facing representation of what
        Brain built; unsupported claims, hidden limitations or leaked secrets can
        invalidate review and handoff even when code is correct.
    ambiguity:
      level: HIGH
      reason: >-
        README/setup/demo language can easily blur implemented, verified,
        available, deferred and production-ready states.
    novelty:
      level: MEDIUM
      reason: >-
        Upstream evidence/report/handoff surfaces exist, but no canonical
        delivery-package compiler or evidence-bound demo contract exists.
    irreversibility:
      level: MEDIUM
      reason: >-
        Documentation is editable, but false delivery claims can propagate to
        customers, judges, operators and future sessions before correction.
    downstream_impact:
      level: HIGH
      reason: >-
        S13Q is the handoff boundary immediately before deployment and later
        capability/runtime stages.

repository_decisions:
  - id: DEC-01
    decision: S13Q is DEEP plus SKILL_ONLY.
  - id: DEC-02
    decision: >-
      S13Q demo means a reproducible evidence-bound walkthrough over an existing
      runnable or inspectable surface, not a new server/browser/deploy runtime.
  - id: DEC-03
    decision: >-
      Part B is a pure deterministic Intelligence reference module; zero Core,
      AgentDefinition, dependency, provider, network or persistence changes.
  - id: DEC-04
    decision: >-
      The structured delivery package is authoritative; README/demo Markdown is
      a derivative deterministic projection and may not add claims.
  - id: DEC-05
    decision: >-
      Setup/run commands, environment-variable names, URLs, ports, paths and demo
      results must come from accepted repository/evidence facts; none are guessed.
  - id: DEC-06
    decision: >-
      S13Q owns documentation/demo/handoff readiness. S13R owns Docker,
      environment/secrets provisioning, health checks, deployment and deployed
      verification.
  - id: DEC-07
    decision: >-
      S14/S15+ capability, MCP, connector, verifier-agent, workflow and
      orchestration work is forbidden pull-forward.
  - id: DEC-08
    decision: >-
      HI-052 may be awarded only after a fresh non-authoring, non-fork, read-only
      verifier independently reproduces all required evidence and the control
      plane factually accepts the result.

limits:
  max_repository_facts: 256
  max_verification_evidence: 256
  max_architecture_facts: 128
  max_setup_steps: 32
  max_demo_steps: 32
  max_limitations: 64
  max_next_steps: 64
  max_evidence_refs_per_claim: 8
  max_total_evidence_refs: 512
  max_safe_ref_chars: 160
  max_text_chars_per_field: 2000
  max_rendered_markdown_bytes: 262144

status_derivation:
  READY:
    requires:
      - exact delivery revision identity valid
      - all required package sections present
      - every material setup/demo claim has accepted evidence
      - no unsupported implemented/verified/production-ready claim
      - no prohibited secret or raw sensitive material
      - known material limitations represented
      - S13R/S14/S15+ boundaries preserved
      - deterministic canonical result
      - all hard invariants PASS
      - all unsafe counters zero
      - fresh independent verification accepted before step closure
  PARTIAL:
    allowed_when:
      - optional non-critical architecture/detail/evidence missing
      - missingness is explicit and no unsupported replacement claim exists
  BLOCKED:
    when_any:
      - exact revision identity missing or conflicting
      - required setup/run evidence absent
      - declared demo surface absent or unsupported
      - secret/raw credential material present
      - material limitation hidden or contradicted
      - production/deployment claim unsupported
      - future-stage implementation pulled forward

hard_invariants:
  - id: S13Q-HI-001
    rule: Exact delivered revision is present, non-empty and unambiguous.
  - id: S13Q-HI-002
    rule: Package claims bind to the delivered revision or explicit accepted ancestry/range evidence.
  - id: S13Q-HI-003
    rule: Structured package is authoritative over rendered prose.
  - id: S13Q-HI-004
    rule: Every material claim is traceable to accepted evidence or marked unknown/limitation.
  - id: S13Q-HI-005
    rule: Implemented and verified are distinct states and never conflated.
  - id: S13Q-HI-006
    rule: Roadmap/spec/TODO/mock/test-name presence alone never proves implementation.
  - id: S13Q-HI-007
    rule: Architecture summary describes existing architecture and introduces no new design decision.
  - id: S13Q-HI-008
    rule: Required setup/run steps use only evidence-backed commands/actions.
  - id: S13Q-HI-009
    rule: Required setup/run steps declare preconditions and expected observable signals.
  - id: S13Q-HI-010
    rule: Environment variable names, ports, URLs, paths and service names are never invented.
  - id: S13Q-HI-011
    rule: Secret values, credentials, cookies, auth headers and private keys never enter output.
  - id: S13Q-HI-012
    rule: Demo surface is existing and explicitly identified.
  - id: S13Q-HI-013
    rule: Every demo step declares action, expected observable result and evidence refs.
  - id: S13Q-HI-014
    rule: Environment-sensitive demo steps declare fallback or stop condition.
  - id: S13Q-HI-015
    rule: Demo never creates or implies a new runtime, browser automation, screenshot recorder or deployment.
  - id: S13Q-HI-016
    rule: Demo claims do not exceed accepted acceptance/eval/test evidence.
  - id: S13Q-HI-017
    rule: Material known limitations are represented and not euphemized away.
  - id: S13Q-HI-018
    rule: Unverified areas are labeled unverified rather than passed.
  - id: S13Q-HI-019
    rule: Next steps are labeled PROPOSED, DEFERRED or REQUIRED_BEFORE_PRODUCTION.
  - id: S13Q-HI-020
    rule: Next steps do not mutate current implementation status.
  - id: S13Q-HI-021
    rule: Evidence index is deduplicated and deterministically ordered.
  - id: S13Q-HI-022
    rule: Evidence conflicts follow canonical precedence and remain visible when material.
  - id: S13Q-HI-023
    rule: Missing evidence remains missing; prose citation is not substituted for evidence identity.
  - id: S13Q-HI-024
    rule: READY never implies production/deployment readiness without separate evidence.
  - id: S13Q-HI-025
    rule: S13R deployment responsibilities are not implemented or claimed complete.
  - id: S13Q-HI-026
    rule: S14/S15+ capability/verifier/workflow/orchestration responsibilities are not pulled forward.
  - id: S13Q-HI-027
    rule: Candidate does not self-award S13Q PASS, HI-052 or independent verification.
  - id: S13Q-HI-028
    rule: No hidden filesystem, git, environment, network, browser, clock or randomness access affects canonical output.
  - id: S13Q-HI-029
    rule: Byte-equivalent normalized inputs produce byte-equivalent canonical output.
  - id: S13Q-HI-030
    rule: Core, AgentDefinition, package manifests and prior canonical Part A remain semantically unchanged.

