  A02: delivery_scope_and_audience_preserved
  A03: implemented_verified_available_deferred_states_not_conflated
  A04: material_claims_have_accepted_evidence
  A05: unsupported_claims_omitted_or_marked_unknown
  A06: roadmap_spec_todo_not_used_as_implementation_proof
  A07: architecture_components_derived_from_existing_facts
  A08: architecture_boundaries_preserved
  A09: no_new_architecture_decision_in_summary
  A10: setup_steps_evidence_backed
  A11: setup_preconditions_and_expected_signals_present
  A12: no_invented_command_env_port_url_or_path
  A13: demo_surface_exists
  A14: demo_steps_action_result_evidence_complete
  A15: demo_fallback_or_stop_conditions_truthful
  A16: material_limitations_present
  A17: unverified_unknown_states_explicit
  A18: limitation_severity_impact_provenance_preserved
  A19: next_steps_status_labeled
  A20: S13R_deployment_boundary_preserved
  A21: S14_S15_plus_boundaries_preserved
  A22: evidence_refs_resolve_and_are_deduplicated
  A23: evidence_conflicts_use_precedence_without_erasure
  A24: provenance_revision_and_source_kind_complete
  A25: no_secret_or_raw_sensitive_material
  A26: secret_variable_names_only_when_approved_and_value_absent
  A27: delivery_output_contains_no_raw_log_prompt_tool_or_private_payload
  A28: deterministic_output_and_ordering
  A29: actual_candidate_gate_and_no_self_certification
  A30: Core_AgentDefinition_dependencies_prior_contracts_unchanged

