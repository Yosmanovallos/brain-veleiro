schema_version: "1.0"
id: S14D_GIT_DEEP
parent_step: S14
phase: S14D
name: git
version: "1.0.0"
status: AUTHORING_READY
classification: RUNTIME_INFRASTRUCTURE
depth: DEEP
honor_invariant: HI-054_NOT_AWARDED

canonical_artifacts:
  skill: brain-bootstrap/skills/GIT_CAPABILITY_SKILL_S14D.md
  quality_contract: brain-bootstrap/quality-contracts/S14D_GIT_DEEP.yaml
  semantic_contract: brain-bootstrap/specs/GIT_CAPABILITY_CONTRACT_S14D.md

baseline:
  main: 4bceeb777127655369ff274b490233764c3e9fd9
  s14c_verified_target: 04f668ad47a1e8c7fac0fc5d241206400fcfd880
  s14c_phase_closure: 4bceeb777127655369ff274b490233764c3e9fd9
  authoring_gate_comment: 5561606182

capabilities:
  - id: repository.status
    side_effects: NONE
  - id: repository.read
    side_effects: NONE

runtime_support:
  node_major: 24
  canonical_platform: linux_wsl
  min_git_version: "2.45.0"
  max_git_major_exclusive: 3

limits:
  max_repository_id_chars: 160
  max_repository_root_chars: 4096
  max_git_executable_path_chars: 4096
  max_revision_chars: 64
  max_path_chars: 4096
  max_path_segments: 256
  max_path_segment_utf8_bytes: 255
  max_status_paths: 1000
  max_blob_bytes: 1048576
  max_stdout_bytes: 1048576
  max_stderr_bytes: 65536
  max_combined_output_bytes: 1114112
  max_repository_timeout_ms: 300000
  termination_grace_ms: 500
  group_cleanup_budget_ms: 4000
  max_evidence_refs: 4
  max_safe_error_chars: 500

scope:
  allowed:
    - provider-layer WorkspaceGitCapabilityProvider
    - repository.status
    - repository.read
    - one explicit local standard Git worktree
    - explicit repository_id
    - explicit repository_root
    - explicit absolute git_executable
    - filesystem-only provider construction
    - per-invocation bounded Git version gate
    - fixed provider-owned Git operation table
    - fixed provider-owned child environment and Git safety overrides
    - committed-object blob reads
    - structured local status metadata
    - Node 24 built-in child_process/fs/path APIs
    - Linux/WSL POSIX process-group cleanup
    - real disposable Git fixtures outside Brain repository
    - CapabilityRegistryProvider composition
    - RestrictedCapabilityProvider composition
    - real runAgent repository path
    - bounded logical repository evidence
  forbidden:
    - Core semantic edits
    - AgentDefinition edits
    - RestrictedCapabilityProvider edits
    - S14A registry semantic edits
    - S14B filesystem semantic edits
    - S14C shell semantic edits
    - S13H planning semantic edits
    - dependency additions
    - model-provided git subcommand
    - model-provided argv or raw option
    - model-provided environment
    - model-provided repository root
    - model-provided git executable
    - shell_true
    - interactive TTY or PTY
    - git mutation
    - network git
    - GitHub API
    - GitLab or Bitbucket API
    - documentation or web search
    - browser automation
    - PostgreSQL
    - MCP
    - OAuth
    - credential storage
    - binary content API
    - submodule recursion
    - sibling worktree traversal
    - S15_plus_work

hard_invariants:
  - {id: S14D-HI-001, rule: "Exactly repository.status and repository.read are exposed by the S14D provider."}
  - {id: S14D-HI-002, rule: "WorkspaceGitCapabilityProvider implements the existing CapabilityProvider contract without Core, AgentDefinition or RestrictedCapabilityProvider changes."}
  - {id: S14D-HI-003, rule: "Both canonical S14D capabilities truthfully declare side_effects NONE; Part B may not relabel them to bypass the contract."}
  - {id: S14D-HI-004, rule: "repository_id, repository_root, git_executable and max_timeout_ms are explicit trusted provider configuration and are never model-controlled."}
  - {id: S14D-HI-005, rule: "Provider create() is filesystem-only and performs no Git/process spawn."}
  - {id: S14D-HI-006, rule: "v1 accepts only one standard non-bare worktree with a direct real .git directory; symlink/gitfile linked-worktree, sparse and alternate-object shapes fail closed."}
  - {id: S14D-HI-007, rule: "Canonical repository root and .git dev:ino identities are recorded and rechecked before repository-facing Git execution; observed drift fails closed."}
  - {id: S14D-HI-008, rule: "The configured Git executable is absolute, canonical, regular and executable, its identity is rechecked before spawn, and no PATH fallback is used."}
  - {id: S14D-HI-009, rule: "Every invocation passes a bounded Git version gate before repository-facing operations and supports only Git >=2.45.0 and <3.0.0."}
  - {id: S14D-HI-010, rule: "repository.status input is exactly an empty object and repository.read input is exactly path plus optional revision; additional model fields are rejected."}
  - {id: S14D-HI-011, rule: "Model revision grammar is only HEAD or a full 40/64-hex object id; raw Git revision mini-language, short SHA and symbolic names are rejected."}
  - {id: S14D-HI-012, rule: "repository.read path obeys the bounded S14B-derived logical grammar; option-like, pathspec-magic, traversal, absolute, drive, UNC/backslash and malformed paths fail before Git content resolution."}
  - {id: S14D-HI-013, rule: "repository.read structurally blocks the canonical S14B/S13H protected-content path floor before returning committed content."}
  - {id: S14D-HI-014, rule: "repository.status returns structured metadata only, exposes no remote URL, sibling worktree host path or file content, and enforces max_status_paths."}
  - {id: S14D-HI-015, rule: "repository.read is committed-object-only and resolves commit -> tree entry -> regular blob -> cat-file; no unresolved model revision:path, worktree byte, index stage, symlink target or gitlink content is returned."}
  - {id: S14D-HI-016, rule: "Every Git subprocess comes from a closed provider-owned operation table; the model cannot choose subcommand, argv, -c options, git-dir/work-tree, format, remote or output target."}
  - {id: S14D-HI-017, rule: "Git execution uses child_process.spawn with shell:false, stdin ignored/closed, bounded stdout/stderr pipes, no TTY/PTY and no command-string concatenation."}
  - {id: S14D-HI-018, rule: "Child environment is exactly provider-built; process.env is not inherited and host Git/credential/loader/runtime injection variables cannot redirect execution."}
  - {id: S14D-HI-019, rule: "All canonical Git safety environment/config overrides are model-immutable and disable optional locks, hooks/fsmonitor, pager/editor/prompts, credential helpers, GPG/signature helpers, auto-maintenance, protocol transports, LFS smudge and submodule recursion."}
  - {id: S14D-HI-020, rule: "The v1 operation table has no network or mutation path and no model field can carry a remote name, URL, credential or transport identity."}
  - {id: S14D-HI-021, rule: "Submodule internals are ignored, gitlinks are not dereferenced, LFS network/smudge is disabled, object alternates are rejected and no sibling-worktree traversal occurs."}
  - {id: S14D-HI-022, rule: "repository.status uses no-optional-locks semantics and canonical successful status/read fixtures leave the complete .git manifest unchanged."}
  - {id: S14D-HI-023, rule: "Auto-gc/maintenance is disabled; a deliberately gc-eligible read fixture leaves no .git mutation and no detached Git maintenance survivor."}
  - {id: S14D-HI-024, rule: "One invocation-wide effective deadline covers version gate, every Git subprocess, output handling and cleanup; no subprocess receives a fresh timeout."}
  - {id: S14D-HI-025, rule: "stdout, stderr, combined output, blob bytes, status entries, path/revision, timeout, evidence and safe-error bounds are enforced; SUCCESS is never silently truncated."}
  - {id: S14D-HI-026, rule: "Model-visible Git/blob text is strict UTF-8; invalid/binary output fails closed with no raw-byte fallback."}
  - {id: S14D-HI-027, rule: "Recognizable secret-bearing committed/output material is not returned, and finite secret recognition is never described as complete."}
  - {id: S14D-HI-028, rule: "Known canonical repository-root and Git-executable host paths are normalized before model visibility; evidence is repository:// logical metadata only."}
  - {id: S14D-HI-029, rule: "Timeout/output overflow performs bounded provider-created POSIX process-group termination with SIGTERM/grace/SIGKILL/liveness cleanup and never claims rollback or universal daemon containment."}
  - {id: S14D-HI-030, rule: "Canonical Git operations cannot execute hooks, aliases-as-command-surrogates, fsmonitor helpers, pager/editor, credential helper, external diff/textconv, submodule/LFS network helpers or auto-maintenance."}
  - {id: S14D-HI-031, rule: "Status parsing is bounded and deterministic for clean, dirty, staged, untracked, detached and unborn states; oversized/malformed status fails rather than truncates."}
  - {id: S14D-HI-032, rule: "repository.read returns at most 1048576 decoded blob bytes from a regular committed blob and rejects tree, symlink, gitlink, missing, binary and protected-content cases."}
  - {id: S14D-HI-033, rule: "RestrictedCapabilityProvider capability denial prevents S14D provider invocation and any Git/version spawn."}
  - {id: S14D-HI-034, rule: "RestrictedCapabilityProvider denial of side_effects NONE prevents S14D provider invocation and any Git/version spawn."}
  - {id: S14D-HI-035, rule: "The real Git provider operates through CapabilityRegistryProvider with no Git-specific registry logic."}
  - {id: S14D-HI-036, rule: "A real runAgent path invokes repository.status/read through RestrictedCapabilityProvider -> registry -> Git provider."}
  - {id: S14D-HI-037, rule: "Changing the selected repository/provider behind the same repository.read capability leaves AgentDefinition and permission-policy bytes unchanged while observed repository content may differ; divergent descriptors are swapped via separate registry configurations, not co-registered."}
  - {id: S14D-HI-038, rule: "Every legal maximum S14D ToolInvocationResult remains transportable through the accepted 8388608-character and 10000-node registry result envelope."}
  - {id: S14D-HI-039, rule: "Core, registry, filesystem, shell, S13H production/tests, prior canonical artifacts and package manifests remain protected/byte-identical; no dependency is added."}
  - {id: S14D-HI-040, rule: "S14D cannot pull forward S14E+ behavior, close S14, award HI-054 or authorize S14E."}

