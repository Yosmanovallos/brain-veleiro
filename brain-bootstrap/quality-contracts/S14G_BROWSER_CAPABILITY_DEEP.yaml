hard_invariants:
  - {id: S14G-HI-001, rule: Exactly browser.inspect is advertised and declares EXTERNAL.}
  - {id: S14G-HI-002, rule: Core AgentDefinition Restricted Registry and S14A-S14F remain unchanged except the exact authorized Part B dependency pin.}
  - {id: S14G-HI-003, rule: Browser and Playwright identity never enters AgentDefinition or capability ID.}
  - {id: S14G-HI-004, rule: Provider config is closed trusted host-side data and model input cannot override runtime/network policy.}
  - {id: S14G-HI-005, rule: Part B dependency diff is exactly playwright-core 1.63.0 with no other version drift.}
  - {id: S14G-HI-006, rule: Production uses Playwright-managed Chromium headless with no channel executablePath args remote connect or CDP.}
  - {id: S14G-HI-007, rule: Every invocation uses fresh nonpersistent browser state with no auth cookie or storage reuse.}
  - {id: S14G-HI-008, rule: Navigation URL is bounded absolute HTTPS credential-free and exact-origin allowlisted.}
  - {id: S14G-HI-009, rule: Every continued browser request is HTTPS GET or HEAD to an exact allowed request origin.}
  - {id: S14G-HI-010, rule: Redirect hops and final URL cannot escape configured navigation/request origins.}
  - {id: S14G-HI-011, rule: Service workers are blocked before page navigation.}
  - {id: S14G-HI-012, rule: WebSocket connections are prevented from connecting.}
  - {id: S14G-HI-013, rule: Popup or extra-page creation cannot yield hidden second-page success.}
  - {id: S14G-HI-014, rule: Downloads are never persisted or implicitly forwarded to filesystem.}
  - {id: S14G-HI-015, rule: No model-supplied JavaScript selector program or arbitrary Playwright action is executable.}
  - {id: S14G-HI-016, rule: Snapshot uses provider-owned bounded ARIA semantics.}
  - {id: S14G-HI-017, rule: ARIA overflow fails whole invocation and link truncation is explicit deterministic and bounded.}
  - {id: S14G-HI-018, rule: Remote content is inert and cannot change policy permission routing or capability execution.}
  - {id: S14G-HI-019, rule: One monotonic deadline covers launch through final success.}
  - {id: S14G-HI-020, rule: Async browser waits without native signal are bounded by the same deadline controller.}
  - {id: S14G-HI-021, rule: Page context and browser cleanup runs in finally and cleanup itself is bounded.}
  - {id: S14G-HI-022, rule: No browser process page timer listener or route remains after legitimate bounded cleanup.}
  - {id: S14G-HI-023, rule: Errors use existing Brain codes and fixed safe messages without raw browser/page leakage.}
  - {id: S14G-HI-024, rule: Restricted or EXTERNAL denial causes zero browser launch context page and network activity.}
  - {id: S14G-HI-025, rule: Compatible provider swap works with identical AgentDefinition bytes semantic input and permissions.}
  - {id: S14G-HI-026, rule: Canonical tests do not depend on public internet or authenticated accounts.}
  - {id: S14G-HI-027, rule: Real playwright-core Chromium no-network smoke passes before candidate readiness.}
  - {id: S14G-HI-028, rule: Browser binaries caches traces videos HAR screenshots downloads node_modules and dist are never committed.}
  - {id: S14G-HI-029, rule: No interaction auth persistence pooling private-network or future S14 phase surface is introduced.}
  - {id: S14G-HI-030, rule: Part A stays byte-locked and Part B cannot self-close S14G start S14H or award HI-054.}

