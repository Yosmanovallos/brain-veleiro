      command_or_check: Parse Quality Contract YAML.
      expected: PASS
    - id: G-A02
      command_or_check: Verify exact cross-references among all three Part A paths.
      expected: PASS
    - id: G-A03
      command_or_check: Validate Skill semantic fields and required contract sections.
      expected: PASS
    - id: G-A04
      command_or_check: Record SHA-256 for all three Part A artifacts before Part B.
      expected: PASS
  focused:
    - id: G-F01
      command_or_check: Positive fixture inventory.
      expected: 14/14
    - id: G-F02
      command_or_check: Negative fixture inventory.
      expected: 52/52
    - id: G-F03
      command_or_check: Atomic-isolation inventory.
      expected: 32/32
    - id: G-F04
      command_or_check: All 24 hard invariants recomputed outside candidate.
      expected: 24/24
    - id: G-F05
      command_or_check: All 16 unsafe counters.
      expected: all_zero
  actual_path:
    - id: G-R01
      command_or_check: Execute actual S12 discovery and exact lazy Skill load.
      expected: PASS
    - id: G-R02
      command_or_check: Execute actual S10/S09 path using the real S13P candidate.
      expected: PASS
    - id: G-R03
      command_or_check: Gate the actual returned candidate, not a synthesized substitute.
      expected: PASS
  repository:
    - id: G-REP01
      command_or_check: Typecheck.
      expected: PASS
    - id: G-REP02
      command_or_check: Full suite before clean build.
      expected: PASS
    - id: G-REP03
      command_or_check: Clean build.
      expected: PASS
    - id: G-REP04
      command_or_check: Full suite after build.
      expected: PASS
    - id: G-REP05
      command_or_check: Architecture, dependency and protected-boundary audit.
      expected: PASS
    - id: G-REP06
      command_or_check: git diff --check and tracked-file hygiene.
      expected: PASS
    - id: G-REP07
      command_or_check: Part A hashes equal the pre-Part-B hashes.
      expected: PASS

ab_impact_gate:
  baseline_arm: no S13P Skill
  candidate_arm: actual S13P Skill and runtime candidate
  frozen_scenarios: 12
  atomic_assertions: 32
  max_points_per_arm: 384
  hidden_truth_access:
    baseline: forbidden
    candidate: forbidden
    provider: forbidden
  pass_conditions:
    candidate_total_strictly_greater_than_baseline: true
    minimum_improved_dimensions: 7
    total_dimensions: 10
    minimum_distinct_improved_assertions_per_qualified_dimension: 2
    maximum_assertion_scenario_regressions: 0
    maximum_single_assertion_share_of_positive_delta: 0.50
    atomic_isolation: 32/32
    unsafe_counters: all_zero
  failure_conditions:
    - Candidate is replaced by a faithful or synthesized substitute.
    - Baseline and candidate receive different scenario inputs or hidden truth.
    - Any assertion/scenario regresses.
    - Improvement is concentrated beyond the allowed share.
    - Fewer than seven dimensions qualify.
    - Any unsafe counter is nonzero.

status_derivation:
  PASS:
    all:
      - All Part A, focused, actual-path and repository gates pass.
      - A/B impact gate passes.
      - All hard invariants pass.
      - All unsafe counters are zero.
      - Fresh independent non-authoring verification reproduces the evidence.
  FAIL:
    any:
      - A deterministic gate fails with reproducible evidence.
      - A hard invariant fails.
      - An unsafe counter is nonzero.
      - A/B impact gate fails.
      - Part A bytes change.
  BLOCKED:
    any:
      - Required repository/runtime evidence cannot be obtained without new authorization.
      - Canonical sources contain a genuine unresolved contradiction.
      - A protected change, provider, dependency or secret-bearing input is required.

independent_verification:
  required: true
  verifier_must_be_non_authoring: true
  fresh_session: true
  may_trust_builder_summary_without_reproduction: false
  required_reproduction:
    - runtime versions and repository SHA
    - Part A hashes
    - focused positives, negatives and atomic isolation
    - actual-candidate gates
    - A/B totals, dimension qualification, regression count and concentration
    - hard invariants and unsafe counters
    - full suite before and after clean build
    - architecture/dependency/diff hygiene
  award_rule: >-
    HI-051 may be awarded only after fresh independent verification PASS and
    factual control-plane acceptance. The builder and candidate cannot award it.

protected_boundaries:
  must_remain_unchanged:
    - S09 runtime semantics
    - S10 AgentDefinition
    - S12 discovery and lazy-load semantics
    - S13I API observability declarations
    - S13L security and minimization rules
    - S13N eval semantics
    - S13O async-reliability semantics
    - Core generic types unless separately re-authored and approved
  forbidden_in_s13p:
    - durable telemetry store
    - exporter or collector
    - dashboard or alerting system
    - provider SDK or vendor-specific type
    - connector, MCP, OAuth or HTTP binding
    - pricing lookup or FX conversion
    - raw event.details export
    - new dependency without a separately approved authoring revision
    - S13Q, S13R, S14, S15 or S20 implementation

part_a_integrity:
  integration_mode: byte_identical
  silent_normalization: forbidden
  semantic_edit_by_integrator: forbidden
  on_semantic_conflict: STOP_AND_RETURN_TO_CHATGPT

closure:
  authoring_result: AUTHORING_READY
  authoring_allows_part_b: false
  next_required_action: >-
    Integrate the three Part A artifacts byte-identically in a separately
    authorized session, validate and record hashes, then stop at the repository's
    next explicit gate.
