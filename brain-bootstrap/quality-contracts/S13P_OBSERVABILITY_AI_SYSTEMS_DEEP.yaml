schema_version: "1.0"
id: S13P_OBSERVABILITY_AI_SYSTEMS_DEEP
step: S13P
name: observability-ai-systems
version: "1.0.0"
status: AUTHORING_READY
depth: DEEP
classification: SKILL_ONLY
honor_invariant_candidate: HI-051

canonical_artifacts:
  skill: brain-bootstrap/skills/OBSERVABILITY_AI_SYSTEMS_SKILL_S13P.md
  quality_contract: brain-bootstrap/quality-contracts/S13P_OBSERVABILITY_AI_SYSTEMS_DEEP.yaml
  semantic_contract: brain-bootstrap/specs/OBSERVABILITY_AI_SYSTEMS_CONTRACT_S13P.md

purpose: >-
  Prove that S13P produces a bounded, deterministic, provider-neutral and
  privacy-safe per-run observability bundle for run identity, traces,
  prompt/version identity, model identity, tool activity, tokens, cost,
  latency and errors, while preserving unknown values, prior contracts and
  future-stage boundaries.

depth_selection:
  result: DEEP
  floors:
    sensitive_data: true
    infrastructure_decision: true
  ratings:
    risk:
      level: HIGH
      reason: >-
        Runtime event details can contain prompts, tool payloads, errors,
        state patches and secret-bearing metadata; unsafe collection can create
        durable disclosure and false audit claims.
    ambiguity:
      level: HIGH
      reason: >-
        The roadmap defines required observability subjects but not their safe
        schema, missingness, aggregation, retention, sampling or S13P/S20 boundary.
    novelty:
      level: MEDIUM
      reason: >-
        Existing S09, S13I, S13N and S13O projections are reusable, but no
        S13P safe bundle, planner or validator exists.
    irreversibility:
      level: HIGH
      reason: >-
        Persisted sensitive telemetry, unbounded cardinality and misleading
        cost/trace records are expensive or impossible to retract completely.
    downstream_impact:
      level: HIGH
      reason: >-
        S13P evidence will be consumed by evals and later S20 decisions; false
        or unsafe evidence can corrupt optimization and governance.

repository_decisions:
  - id: DEC-01
    decision: S13P is DEEP plus SKILL_ONLY.
  - id: DEC-02
    decision: >-
      Part B is a pure deterministic Intelligence reference module with no
      durable store, exporter, network call, provider SDK or new dependency.
  - id: DEC-03
    decision: >-
      Core, AgentDefinition and all prior canonical Part A remain unchanged.
  - id: DEC-04
    decision: >-
      S13P owns safe per-run projection and bounded aggregation; S20 owns
      durable cross-run products, alerts, dashboards, optimization and
      improvement orchestration.
  - id: DEC-05
    decision: >-
      Raw prompt, message, context, tool payload, HTTP material, secret value,
      provider error and arbitrary provider metadata are prohibited.
  - id: DEC-06
    decision: >-
      Missing tokens, cost or latency remain unknown; cost is observed-only,
      exact-decimal and grouped by currency without lookup or conversion.
  - id: DEC-07
    decision: >-
      Sampling is deterministic and never removes lifecycle, terminal, error,
      safety, failed/cancelled or dropped-summary evidence.
  - id: DEC-08
    decision: >-
      Retention is a bounded directive only: EPHEMERAL by default,
      OPERATIONAL at most 7 days, AUDIT_REF_ONLY at most 30 days.

uncertainty_and_limitations:
  - id: LIM-01
    statement: >-
      Safe-ref grammar cannot prove that a caller did not encode personal or
      secret data in an identifier; upstream authorization and structural
      projection remain required.
  - id: LIM-02
    statement: >-
      Digesting data is not anonymization and cannot make prohibited content safe.
  - id: LIM-03
    statement: >-
      S13P cannot guarantee lossless distributed tracing when source evidence is
      missing, late or contradictory; it reports PARTIAL instead.
  - id: LIM-04
    statement: >-
      S13P validates three-letter currency shape but does not maintain a legal
      tender registry, price table or FX service.
  - id: LIM-05
    statement: >-
      The reference module does not prove storage deletion, retention execution,
      exporter behavior or cross-run analytics.
  - id: LIM-06
    statement: >-
      Defensive pattern scans cannot claim complete secret or personal-data detection.

hard_invariants:
  - id: S13P-HI-001
    rule: Every accepted observation binds the bundle run_id and trace_id.
    failure: BLOCK
  - id: S13P-HI-002
    rule: Empty, conflicting or cross-run bundle identity is rejected.
    failure: BLOCK
  - id: S13P-HI-003
    rule: Unknown top-level or nested observation keys are rejected, never copied.
    failure: BLOCK
  - id: S13P-HI-004
    rule: >-
      Raw prompt/message/context/tool/HTTP/provider-error/arbitrary-metadata
      content never enters an accepted observation, diagnostic, aggregate or bundle.
    failure: BLOCK
  - id: S13P-HI-005
    rule: Digests use only approved canonical non-secret material and are never treated as anonymization.
    failure: BLOCK
  - id: S13P-HI-006
    rule: No credential, cookie, authorization value, private key or secret value is accepted or echoed.
    failure: BLOCK
  - id: S13P-HI-007
    rule: Observation IDs and sequences are unique; sorted sequences strictly increase.
    failure: BLOCK
  - id: S13P-HI-008
    rule: The accepted span-parent graph is acyclic and missing parents are explicit.
    failure: BLOCK
  - id: S13P-HI-009
    rule: COMPLETE requires one start and one terminal observation with explicit outcome and reason.
    failure: BLOCK
  - id: S13P-HI-010
    rule: Missing optional metrics remain unknown and are never converted to zero, success or failure.
    failure: BLOCK
  - id: S13P-HI-011
    rule: Token values are safe integers and component, total and cache-subset consistency is enforced.
    failure: BLOCK
  - id: S13P-HI-012
    rule: Cost is accepted only as an observed non-negative canonical decimal with explicit currency and provenance.
    failure: BLOCK
  - id: S13P-HI-013
    rule: Different currencies are never combined into a cross-currency total.
    failure: BLOCK
  - id: S13P-HI-014
    rule: Latency is observed from an approved clock source and never synthesized from unavailable evidence.
    failure: BLOCK
  - id: S13P-HI-015
    rule: Errors contain only normalized safe source/category/code/retryability and an approved optional fingerprint.
    failure: BLOCK
  - id: S13P-HI-016
    rule: Required lifecycle, terminal, error, safety, failed/cancelled and drop-summary evidence is never sampled out.
    failure: BLOCK
  - id: S13P-HI-017
    rule: All per-run cardinality, duration, reference and serialized-byte ceilings are enforced.
    failure: BLOCK
  - id: S13P-HI-018
    rule: Retention cannot exceed EPHEMERAL, 7-day OPERATIONAL or 30-day AUDIT_REF_ONLY semantics.
    failure: BLOCK
  - id: S13P-HI-019
    rule: Inputs are not mutated and equal normalized inputs/policy produce equal output.
    failure: BLOCK
  - id: S13P-HI-020
    rule: Part B performs no network, storage, export, provider binding, hidden clock or unseeded randomness.
    failure: BLOCK
  - id: S13P-HI-021
    rule: S09, S10, S12, S13I, S13L, S13N and S13O semantics remain unchanged.
    failure: BLOCK
  - id: S13P-HI-022
    rule: The candidate cannot award PASS, HI-051 or independent verification to itself.
    failure: BLOCK
  - id: S13P-HI-023
    rule: All gates execute against the actual runtime candidate; no faithful substitute is accepted.
    failure: BLOCK
  - id: S13P-HI-024
    rule: The three canonical Part A artifacts remain byte-identical through Part B and closure.
    failure: BLOCK

semantic_dimensions:
  - id: D01_IDENTITY_CORRELATION
    name: Identity and correlation
    assertions:
      - id: A01
        statement: Stable bundle run and trace identities are explicit and valid.
      - id: A02
        statement: Every accepted observation matches the bundle run and trace.
      - id: A03
        statement: Applicable call, operation, job and attempt refs correlate without collision.
      - id: A04
        statement: Cross-run or conflicting identity is rejected deterministically.
  - id: D02_TRACE_RECONSTRUCTION
    name: Trace reconstruction
    assertions:
      - id: A05
        statement: Observation IDs/sequences are unique and ordered deterministically.
      - id: A06
        statement: Span parents resolve or are marked missing, and cycles are rejected.
      - id: A07
        statement: Lifecycle, phase and terminal completeness are truthful.
  - id: D03_PROMPT_MODEL_IDENTITY
    name: Prompt and model identity
    assertions:
      - id: A08
        statement: Prompt/template identity uses safe refs and explicit versions without content.
      - id: A09
        statement: Digests obey the approved sha256 form and safe-material rule.
      - id: A10
        statement: Model/provider/version identity is useful and provider-neutral.
  - id: D04_TOOL_ASYNC_ACTIVITY
    name: Tool and async activity
    assertions:
      - id: A11
        statement: Tool calls expose capability, phase, outcome and side-effect class without payloads.
      - id: A12
        statement: Model/tool start-completion pairs and durations are structurally valid.
      - id: A13
        statement: S13O operation/job/attempt facts correlate without reimplementing retry policy.
  - id: D05_USAGE_COST_TRUTH
    name: Token and cost truth
    assertions:
      - id: A14
        statement: Token counts are observed, bounded and internally consistent.
      - id: A15
        statement: Missing usage remains unknown with explicit coverage.
      - id: A16
        statement: Cost uses exact observed decimals with explicit provenance.
      - id: A17
        statement: Costs aggregate only within a currency and never use pricing/FX inference.
  - id: D06_LATENCY_ERROR_TRUTH
    name: Latency and error truth
    assertions:
      - id: A18
        statement: Latency uses approved clock evidence and bounded integer milliseconds.
      - id: A19
        statement: Clock skew, late evidence and metric conflicts remain explicit.
      - id: A20
        statement: Errors use normalized safe fields without raw messages or stacks.
  - id: D07_PRIVACY_REDACTION
    name: Privacy and redaction
    assertions:
      - id: A21
        statement: Structural allowlists exclude raw prompt/message/context data.
      - id: A22
        statement: Tool, HTTP, secret and credential values are excluded.
      - id: A23
        statement: Arbitrary provider metadata and raw errors are excluded.
      - id: A24
        statement: Diagnostics and dropped summaries never echo rejected values.
  - id: D08_BOUNDS_LIFECYCLE
    name: Cardinality, sampling and retention
    assertions:
      - id: A25
        statement: Cardinality, reference, duration and serialized-byte ceilings are enforced.
      - id: A26
        statement: Sampling is deterministic and required evidence is never dropped.
      - id: A27
        statement: Retention directives are bounded and do not claim storage execution.
  - id: D09_ARCHITECTURE_BOUNDARIES
    name: Architecture and provider neutrality
    assertions:
      - id: A28
        statement: S13P remains a pure Intelligence reference module with no provider/store/dependency.
      - id: A29
        statement: Core, AgentDefinition and prior step contracts remain unchanged.
      - id: A30
        statement: S13P/S20 and connector/deploy boundaries are explicit and preserved.
  - id: D10_EVIDENCE_DETERMINISM
    name: Evidence and determinism
    assertions:
      - id: A31
        statement: Output provenance, coverage, diagnostics and status are reproducible and immutable.
      - id: A32
        statement: External gates use the actual candidate and recompute every claim.

